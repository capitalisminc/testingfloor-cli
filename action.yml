name: Upload Testing Floor build
description: Upload a ready-to-run game build folder to Testing Floor.
author: Capitalism Inc.

inputs:
  api-token:
    description: Testing Floor API key with builds:create scope.
    required: true
  api-url:
    description: Testing Floor base URL.
    required: false
    default: https://api.testingfloor.com
  game-id:
    description: Numeric Testing Floor game id.
    required: true
  organization-id:
    description: Testing Floor organization slug or numeric id. Can also be set with TESTING_FLOOR_ORGANIZATION_ID.
    required: false
  platform:
    description: "Testing Floor platform: windows, macos, or linux."
    required: true
  branch:
    description: "Branch key on the game to upload this build to (e.g. \"unity-main\", \"ue-main\"). Defaults to the game's default branch. Unknown keys are rejected."
    required: false
  archive:
    description: Removed. Set build-directory to the unzipped build folder.
    required: false
    deprecationMessage: The archive input was removed. Set build-directory to the unzipped build folder.
  archive-kind:
    description: No longer used. Every upload sends a wharf patch for the recorder plus chunks for zip downloads.
    required: false
    deprecationMessage: archive-kind is no longer used and can be removed. Every upload sends a wharf patch for the recorder plus chunks for zip downloads.
  butler-path:
    description: Optional path to the butler executable that makes the recorder's wharf patch. Installed automatically when omitted.
    required: false
  butler-version:
    description: Butler version to install automatically.
    required: false
    default: LATEST
  build-directory:
    description: The ready-to-run build folder. Uploaded as deduplicated chunks (only what changed since earlier builds) that Testing Floor serves as the zip download, plus a wharf patch the desktop recorder installs from.
    required: true
  filename:
    description: Filename for the zip download.
    required: false
  version:
    description: Build version metadata.
    required: true
  git-sha:
    description: Git SHA metadata.
    required: false
  launch-path:
    description: Executable path inside the extracted archive.
    required: true
  launch-args:
    description: JSON array of launch arguments.
    required: false
    default: "[]"
  working-directory:
    description: Working directory inside the extracted archive.
    required: false
    default: "."
  source-ref:
    description: JSON object of source metadata to store with the build.
    required: false
    default: "{}"

outputs:
  build-id:
    description: Testing Floor game_build id.
  status:
    description: Final build status.
  ready-at:
    description: Ready timestamp returned by Testing Floor.
  checksum-sha256:
    description: SHA-256 checksum reported by Testing Floor, when there is one.
  size-bytes:
    description: Total size of the build folder.

runs:
  using: node24
  main: dist/action.cjs
