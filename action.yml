name: Upload Testing Floor build
description: Upload a game build folder or existing ZIP archive to Testing Floor.
author: Capitalism Inc.

inputs:
  api-token:
    description: Testing Floor API key with builds:create scope.
    required: true
  api-url:
    description: Testing Floor base URL.
    required: false
    default: https://api.testingfloor.com
  game-id:
    description: Numeric Testing Floor game id.
    required: true
  organization-id:
    description: Testing Floor organization slug or numeric id. Can also be set with TESTING_FLOOR_ORGANIZATION_ID.
    required: false
  build-id:
    description: "Immutable artifact ID also sent by the SDK and map upload; separate from the numeric build-id output."
    required: false
  platform:
    description: "Testing Floor platform: windows, macos, or linux."
    required: true
  branch:
    description: "Branch key on the game to upload this build to (e.g. \"unity-main\", \"ue-main\"). Defaults to the game's default branch. Unknown keys are rejected."
    required: false
  archive-kind:
    description: No longer used. Every upload sends chunks for desktop installs, updates and zip downloads.
    required: false
    deprecationMessage: archive-kind is no longer used and can be removed. Every upload sends chunks for desktop installs, updates and zip downloads.
  idempotency-key:
    description: "Stable CI operation key for recovering retries; change for a new upload"
    required: false
  archive:
    description: "Existing ZIP archive (choose this or build-directory)"
    required: false
  build-directory:
    description: The ready-to-run build folder, uploaded as deduplicated chunks. Choose this or archive.
    required: false
  filename:
    description: Filename for the zip download.
    required: false
  version:
    description: Build version metadata.
    required: true
  description:
    description: Optional plain text description, up to 1000 characters. Shown only in the website's build list.
    required: false
  git-sha:
    description: Git SHA metadata.
    required: false
  launch-path:
    description: Executable path inside the extracted archive.
    required: true
  launch-args:
    description: JSON array of launch arguments.
    required: false
    default: "[]"
  working-directory:
    description: Working directory inside the extracted archive.
    required: false
    default: "."
  source-ref:
    description: JSON object of source metadata to store with the build.
    required: false
    default: "{}"

outputs:
  build-id:
    description: Numeric Testing Floor build record ID.
  status:
    description: Final build status.
  ready-at:
    description: Ready timestamp returned by Testing Floor.
  checksum-sha256:
    description: SHA-256 checksum reported by Testing Floor, when there is one.
  size-bytes:
    description: Total size of the build folder.

runs:
  using: node24
  main: dist/action.cjs
